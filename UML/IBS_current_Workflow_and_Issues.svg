<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="3699px" preserveAspectRatio="none" style="width:5110px;height:3699px;background:#FFFFFF;" version="1.1" viewBox="0 0 5110 3699" width="5110px" zoomAndPan="magnify"><defs/><g><rect fill="none" height="20.9531" style="stroke:none;stroke-width:1;" width="5077.5757" x="15" y="12.7451"/><ellipse cx="188.7578" cy="48.6982" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><path d="M385.8252,78.6982 L385.8252,134.0967 L770.2222,134.0967 L770.2222,88.6982 L760.2222,78.6982 L385.8252,78.6982" fill="#FFFFCC" style="stroke:#181818;stroke-width:0.5;"/><path d="M760.2222,78.6982 L760.2222,88.6982 L770.2222,88.6982 L760.2222,78.6982" fill="#FFFFCC" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="74.3438" x="391.8252" y="95.7651">&#214;PNV Abo</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="207.6382" x="466.1689" y="95.7651">: Bank statement (+ Card once)</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="93.3359" x="391.8252" y="110.8979">&#214;PNV Online</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="270.061" x="485.1611" y="110.8979">: Screenshot + Bank statement + Invoice</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="33.9409" x="391.8252" y="126.0308">PKW</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="193.4829" x="425.7661" y="126.0308">: License plate + General info</text><path d="M366.5156,154.0967 L366.5156,209.4951 L789.5317,209.4951 L789.5317,164.0967 L779.5317,154.0967 L366.5156,154.0967" fill="#FFCCCC" style="stroke:#181818;stroke-width:0.5;"/><path d="M779.5317,154.0967 L779.5317,164.0967 L789.5317,164.0967 L779.5317,154.0967" fill="#FFCCCC" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="89.3687" x="372.5156" y="171.1636">PROBLEM 1:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="308.5151" x="466.0166" y="171.1636">TNs often miss the 15th of the month deadline.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="383.7856" x="372.5156" y="186.2964">Admin has to constantly chase them via email or in person</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="196.1426" x="372.5156" y="201.4292">to upload missing documents.</text><path d="M380.6995,229.4951 L380.6995,300.0264 L775.3479,300.0264 L775.3479,239.4951 L765.3479,229.4951 L380.6995,229.4951" fill="#FFCCCC" style="stroke:#181818;stroke-width:0.5;"/><path d="M765.3479,229.4951 L765.3479,239.4951 L775.3479,239.4951 L765.3479,229.4951" fill="#FFCCCC" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="102.9399" x="386.6995" y="246.562">PROBLEM 14 :</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="266.5762" x="493.7717" y="246.562">There is no automated reminder system.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="338.5459" x="386.6995" y="261.6948">All deadline reminders are done manually by Admin</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="345.7949" x="386.6995" y="276.8276">via email or in person &#8212; recurring time-drain with no</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="183.0283" x="386.6995" y="291.9604">scalable or reliable solution.</text><rect fill="#E3F2FD" height="33.9688" rx="12.5" ry="12.5" style="stroke:#0D47A1;stroke-width:0.5;" width="335.5156" x="21" y="172.3779"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="315.5156" x="31" y="193.5166">Upload required documents to personal Cloud folder</text><rect fill="#E3F2FD" height="33.9688" rx="12.5" ry="12.5" style="stroke:#0D47A1;stroke-width:0.5;" width="193.9648" x="91.7754" y="1574.0215"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="173.9648" x="101.7754" y="1595.1602">Upload corrected documents</text><path d="M325.0967,2751.0991 L325.0967,2774.7983 L305.0967,2778.7983 L325.0967,2782.7983 L325.0967,2806.4976 A0,0 0 0 0 325.0967,2806.4976 L660.2104,2806.4976 A0,0 0 0 0 660.2104,2806.4976 L660.2104,2761.0991 L650.2104,2751.0991 L325.0967,2751.0991 A0,0 0 0 0 325.0967,2751.0991" fill="#FFCCCC" style="stroke:#181818;stroke-width:0.5;"/><path d="M650.2104,2751.0991 L650.2104,2761.0991 L660.2104,2761.0991 L650.2104,2751.0991" fill="#FFCCCC" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="89.3687" x="331.0967" y="2768.166">PROBLEM 7:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="217.9912" x="424.5977" y="2768.166">TNs are often not at the institute.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="314.1138" x="331.0967" y="2783.2988">Waiting for them or using postal mail delays the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="119.5137" x="331.0967" y="2798.4316">process by weeks.</text><rect fill="#E3F2FD" height="33.9688" rx="12.5" ry="12.5" style="stroke:#0D47A1;stroke-width:0.5;" width="232.6777" x="72.4189" y="2761.814"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="212.6777" x="82.4189" y="2782.9526">Sign the Fahrkosten form with date</text><line style="stroke:#000000;stroke-width:1.5;" x1="15" x2="15" y1="12.7451" y2="3687.7749"/><rect fill="#E3F2FD" height="33.9688" rx="12.5" ry="12.5" style="stroke:#0D47A1;stroke-width:0.5;" width="242.375" x="840.8013" y="330.0264"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="222.375" x="850.8013" y="351.165">Track daily attendance (V, N, U, etc.)</text><path d="M1120.3735,380.8467 L1120.3735,396.9795 L1100.3735,400.9795 L1120.3735,404.9795 L1120.3735,421.1123 A0,0 0 0 0 1120.3735,421.1123 L1513.9619,421.1123 A0,0 0 0 0 1513.9619,421.1123 L1513.9619,390.8467 L1503.9619,380.8467 L1120.3735,380.8467 A0,0 0 0 0 1120.3735,380.8467" fill="#FFCCCC" style="stroke:#181818;stroke-width:0.5;"/><path d="M1503.9619,380.8467 L1503.9619,390.8467 L1513.9619,390.8467 L1503.9619,380.8467" fill="#FFCCCC" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="89.3687" x="1126.3735" y="397.9136">PROBLEM 8:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="251.8369" x="1219.8745" y="397.9136">Dozents submit lists very late because</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="372.5884" x="1126.3735" y="413.0464">they are busy or forget. Admin has to ask multiple times.</text><rect fill="#E3F2FD" height="33.9688" rx="12.5" ry="12.5" style="stroke:#0D47A1;stroke-width:0.5;" width="276.7695" x="823.604" y="383.9951"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="256.7695" x="833.604" y="405.1338">Complete Anwesenheitsliste for the month</text><rect fill="#E3F2FD" height="33.9688" rx="12.5" ry="12.5" style="stroke:#0D47A1;stroke-width:0.5;" width="302.9141" x="810.5317" y="441.1123"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="282.9141" x="820.5317" y="462.251">Provide completed Anwesenheitsliste to Admin</text><line style="stroke:#000000;stroke-width:1.5;" x1="804.5317" x2="804.5317" y1="12.7451" y2="3687.7749"/><path d="M1836.9951,491.9326 L1836.9951,508.0654 L1816.9951,512.0654 L1836.9951,516.0654 L1836.9951,532.1982 A0,0 0 0 0 1836.9951,532.1982 L2119.3281,532.1982 A0,0 0 0 0 2119.3281,532.1982 L2119.3281,501.9326 L2109.3281,491.9326 L1836.9951,491.9326 A0,0 0 0 0 1836.9951,491.9326" fill="#FFFFCC" style="stroke:#181818;stroke-width:0.5;"/><path d="M2109.3281,491.9326 L2109.3281,501.9326 L2119.3281,501.9326 L2109.3281,491.9326" fill="#FFFFCC" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="229.1123" x="1842.9951" y="508.9995">Collects contracts, gets signatures,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="261.333" x="1842.9951" y="524.1323">and handles all related internship tasks.</text><rect fill="#E3F2FD" height="33.9688" rx="12.5" ry="12.5" style="stroke:#0D47A1;stroke-width:0.5;" width="189.8984" x="1627.0967" y="495.0811"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="169.8984" x="1637.0967" y="516.2197">Manage Praktikumsvertr&#228;ge</text><path d="M1939.1299,542.1982 L1939.1299,565.8975 L1919.1299,569.8975 L1939.1299,573.8975 L1939.1299,597.5967 A0,0 0 0 0 1939.1299,597.5967 L2345.6675,597.5967 A0,0 0 0 0 2345.6675,597.5967 L2345.6675,552.1982 L2335.6675,542.1982 L1939.1299,542.1982 A0,0 0 0 0 1939.1299,542.1982" fill="#FFCCCC" style="stroke:#181818;stroke-width:0.5;"/><path d="M2335.6675,542.1982 L2335.6675,552.1982 L2345.6675,552.1982 L2335.6675,542.1982" fill="#FFCCCC" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="98.4141" x="1945.1299" y="559.2651">PROBLEM 13:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="282.9912" x="2047.6763" y="559.2651">Admin doesn't automatically know who has</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="323.8384" x="1945.1299" y="574.3979">an internship; has to manually ask this colleague,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="88.207" x="1945.1299" y="589.5308">wasting time.</text><rect fill="#E3F2FD" height="33.9688" rx="12.5" ry="12.5" style="stroke:#0D47A1;stroke-width:0.5;" width="394.168" x="1524.9619" y="552.9131"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="374.168" x="1534.9619" y="574.0518">Provide signed Praktikumsvertrag to Admin (if TN is an Intern)</text><line style="stroke:#000000;stroke-width:1.5;" x1="1518.9619" x2="1518.9619" y1="12.7451" y2="3687.7749"/><path d="M2986.9541,617.5967 L2986.9541,703.2607 L3387.2202,703.2607 L3387.2202,627.5967 L3377.2202,617.5967 L2986.9541,617.5967" fill="#FFCCCC" style="stroke:#181818;stroke-width:0.5;"/><path d="M3377.2202,617.5967 L3377.2202,627.5967 L3387.2202,627.5967 L3377.2202,617.5967" fill="#FFCCCC" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="93.8945" x="2992.9541" y="634.6636">PROBLEM 6 :</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="192.9307" x="3090.981" y="634.6636">No document status tracking.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="347.604" x="2992.9541" y="649.7964">When Admin checks the Cloud folder for an expected</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="330.4019" x="2992.9541" y="664.9292">document, there is no indicator of whether a TN or</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="379.2661" x="2992.9541" y="680.062">colleague has actually submitted it. Admin must manually</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="285.0415" x="2992.9541" y="695.1948">browse and verify every single file by hand.</text><path d="M2984.1357,723.2607 L2984.1357,808.9248 L3390.0386,808.9248 L3390.0386,733.2607 L3380.0386,723.2607 L2984.1357,723.2607" fill="#FFCCCC" style="stroke:#181818;stroke-width:0.5;"/><path d="M3380.0386,723.2607 L3380.0386,733.2607 L3390.0386,733.2607 L3380.0386,723.2607" fill="#FFCCCC" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="93.8945" x="2990.1357" y="740.3276">PROBLEM 4 :</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="237.3071" x="3088.1626" y="740.3276">No handover or substitution system.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="331.6587" x="2990.1357" y="755.4604">If Admin is absent and a colleague must take over,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="343.3765" x="2990.1357" y="770.5933">they have no visibility into what is pending, finished,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="384.9028" x="2990.1357" y="785.7261">or missing &#8212; and no idea who is responsible for each item.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="348.8481" x="2990.1357" y="800.8589">All process knowledge lives only in the Admin's head.</text><rect fill="#E3F2FD" height="33.9688" rx="12.5" ry="12.5" style="stroke:#0D47A1;stroke-width:0.5;" width="279.3008" x="2694.835" y="696.2764"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="259.3008" x="2704.835" y="717.415">Collect all uploaded documents from Cloud</text><path d="M3017.3594,828.9248 L3017.3594,852.624 L2997.3594,856.624 L3017.3594,860.624 L3017.3594,884.3232 A0,0 0 0 0 3017.3594,884.3232 L3376.2134,884.3232 A0,0 0 0 0 3376.2134,884.3232 L3376.2134,838.9248 L3366.2134,828.9248 L3017.3594,828.9248 A0,0 0 0 0 3017.3594,828.9248" fill="#FFCCCC" style="stroke:#181818;stroke-width:0.5;"/><path d="M3366.2134,828.9248 L3366.2134,838.9248 L3376.2134,838.9248 L3366.2134,828.9248" fill="#FFCCCC" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="89.3687" x="3023.3594" y="845.9917">PROBLEM 9:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="233.873" x="3116.8604" y="845.9917">Late medical certificates (AU) mean</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="337.854" x="3023.3594" y="861.1245">Admin must constantly check with Dozents to see if</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="262.501" x="3023.3594" y="876.2573">absences should be updated in the lists.</text><rect fill="#E3F2FD" height="33.9688" rx="12.5" ry="12.5" style="stroke:#0D47A1;stroke-width:0.5;" width="325.748" x="2671.6113" y="839.6396"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="305.748" x="2681.6113" y="860.7783">Receive completed Anwesenheitsliste from Dozent</text><rect fill="#E3F2FD" height="33.9688" rx="12.5" ry="12.5" style="stroke:#0D47A1;stroke-width:0.5;" width="381.8633" x="2643.5537" y="904.3232"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="361.8633" x="2653.5537" y="925.4619">Receive signed Praktikumsvertrag from Colleague (if Intern)</text><path d="M2982.6162,1005.6118 L2982.6162,1036.8774 L2962.6162,1040.8774 L2982.6162,1044.8774 L2982.6162,1076.1431 A0,0 0 0 0 2982.6162,1076.1431 L3303.1875,1076.1431 A0,0 0 0 0 3303.1875,1076.1431 L3303.1875,1015.6118 L3293.1875,1005.6118 L2982.6162,1005.6118 A0,0 0 0 0 2982.6162,1005.6118" fill="#FFCCCC" style="stroke:#181818;stroke-width:0.5;"/><path d="M3293.1875,1005.6118 L3293.1875,1015.6118 L3303.1875,1015.6118 L3293.1875,1005.6118" fill="#FFCCCC" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="106.9326" x="2988.6162" y="1022.6787">Deadline Rule:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="299.5713" x="2988.6162" y="1037.8115">All documents must be submitted by the 15th</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="254.9536" x="2988.6162" y="1052.9443">of the following month. Late or missing</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="291.2368" x="2988.6162" y="1068.0771">submissions result in loss of reimbursement.</text><rect fill="#E3F2FD" height="47.9375" rx="12.5" ry="12.5" style="stroke:#0D47A1;stroke-width:0.5;" width="256.2617" x="2706.3545" y="1016.9087"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="177.4453" x="2716.3545" y="1038.0474">Notify TN: deadline missed &#8212;</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="236.2617" x="2716.3545" y="1052.0161">reimbursement forfeited for this month</text><ellipse cx="2834.4854" cy="1107.1431" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="2834.4854" cy="1107.1431" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><polygon fill="#E3F2FD" points="2754.7837,958.292,2914.187,958.292,2926.187,971.0967,2914.187,983.9014,2754.7837,983.9014,2742.7837,971.0967,2754.7837,958.292" style="stroke:#0D47A1;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="14.9585" x="2838.4854" y="994.1118">No</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="159.4033" x="2754.7837" y="968.5024">Documents received by 15th</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="108.5874" x="2754.7837" y="981.3071">of following month?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.2178" x="2926.187" y="968.5024">Yes</text><polygon fill="#E3F2FD" points="2789.3279,1208.5454,2879.6428,1208.5454,2891.6428,1220.5454,2879.6428,1232.5454,2789.3279,1232.5454,2777.3279,1220.5454,2789.3279,1208.5454" style="stroke:#0D47A1;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="90.3149" x="2789.3279" y="1224.3535">Praktikum case?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.2178" x="2758.1101" y="1217.9512">Yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="14.9585" x="2891.6428" y="1217.9512">No</text><rect fill="#E3F2FD" height="33.9688" rx="12.5" ry="12.5" style="stroke:#0D47A1;stroke-width:0.5;" width="179.7969" x="3050.8481" y="1252.5454"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="159.7969" x="3060.8481" y="1273.6841">No reimbursement eligible</text><ellipse cx="3140.7466" cy="1332.5142" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="3140.7466" cy="1332.5142" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><polygon fill="#E3F2FD" points="2795.2065,1160.1431,2873.7642,1160.1431,2885.7642,1172.1431,2873.7642,1184.1431,2795.2065,1184.1431,2783.2065,1172.1431,2795.2065,1160.1431" style="stroke:#0D47A1;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="14.9585" x="2838.4854" y="1194.3535">No</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="78.5576" x="2795.2065" y="1175.9512">Route &gt; 3km?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.2178" x="2763.9888" y="1169.5488">Yes</text><polygon fill="#E3F2FD" points="2834.4854,1363.5142,2846.4854,1375.5142,2834.4854,1387.5142,2822.4854,1375.5142,2834.4854,1363.5142" style="stroke:#0D47A1;stroke-width:0.5;"/><path d="M2994.6484,1453.2246 L2994.6484,1499.623 L2974.6484,1503.623 L2994.6484,1507.623 L2994.6484,1554.0215 A0,0 0 0 0 2994.6484,1554.0215 L3394.0449,1554.0215 A0,0 0 0 0 3394.0449,1554.0215 L3394.0449,1463.2246 L3384.0449,1453.2246 L2994.6484,1453.2246 A0,0 0 0 0 2994.6484,1453.2246" fill="#FFCCCC" style="stroke:#181818;stroke-width:0.5;"/><path d="M3384.0449,1453.2246 L3384.0449,1463.2246 L3394.0449,1463.2246 L3384.0449,1453.2246" fill="#FFCCCC" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="93.8945" x="3000.6484" y="1470.2915">PROBLEM 5 :</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="238.0308" x="3098.6753" y="1470.2915">Admin relies on sticky notes to track</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="378.3965" x="3000.6484" y="1485.4243">outstanding document requests and to communicate with</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="363.0161" x="3000.6484" y="1500.5571">colleagues. Sticky notes frequently fall off desks or lose</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="354.4785" x="3000.6484" y="1515.6899">stickiness and are never seen. Notes left on an absent</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="257.8926" x="3000.6484" y="1530.8228">colleague's desk are equally unreliable.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="355.3418" x="3000.6484" y="1545.9556">There is no formal task-tracking or messaging system.</text><rect fill="#E3F2FD" height="33.9688" rx="12.5" ry="12.5" style="stroke:#0D47A1;stroke-width:0.5;" width="280.3262" x="2694.3223" y="1486.6387"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="260.3262" x="2704.3223" y="1507.7773">Request missing or corrected docs from TN</text><polygon fill="#E3F2FD" points="2751.8108,1407.5142,2917.1599,1407.5142,2929.1599,1419.5142,2917.1599,1431.5142,2751.8108,1431.5142,2739.8108,1419.5142,2751.8108,1407.5142" style="stroke:#0D47A1;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="14.9585" x="2838.4854" y="1441.7246">No</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="165.3491" x="2751.8108" y="1423.3223">Documents complete &amp; valid?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.2178" x="2720.593" y="1416.9199">Yes</text><path d="M2996.9805,1639.9902 L2996.9805,1678.8223 L2976.9805,1682.8223 L2996.9805,1686.8223 L2996.9805,1725.6543 A0,0 0 0 0 2996.9805,1725.6543 L3387.6807,1725.6543 A0,0 0 0 0 3387.6807,1725.6543 L3387.6807,1649.9902 L3377.6807,1639.9902 L2996.9805,1639.9902 A0,0 0 0 0 2996.9805,1639.9902" fill="#FFFFCC" style="stroke:#181818;stroke-width:0.5;"/><path d="M3377.6807,1639.9902 L3377.6807,1649.9902 L3387.6807,1649.9902 L3377.6807,1639.9902" fill="#FFFFCC" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="369.7002" x="3002.9805" y="1657.0571">Attendance Rules (per Anwesenheitsberechnung):</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="338.438" x="3002.9805" y="1672.1899">x, E, K, (x) in V or N = present (max 1 day per date)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="302.0151" x="3002.9805" y="1687.3228">U or empty (unjustified) = absent / unexcused</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="347.4834" x="3002.9805" y="1702.4556">Holidays &amp; bridge days = excused (count as present)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="320.5376" x="3002.9805" y="1717.5884">Formula: IF(any valid sign in V or N, 1, 0) per day</text><rect fill="#E3F2FD" height="33.9688" rx="12.5" ry="12.5" style="stroke:#0D47A1;stroke-width:0.5;" width="284.9902" x="2691.9902" y="1665.8379"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="264.9902" x="2701.9902" y="1686.9766">Calculate total presence days for the month</text><polygon fill="#E3F2FD" points="2745.9697,1745.6543,2923.001,1745.6543,2935.001,1757.6543,2923.001,1769.6543,2745.9697,1769.6543,2733.9697,1757.6543,2745.9697,1745.6543" style="stroke:#0D47A1;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="177.0313" x="2745.9697" y="1761.4624">Unexcused absences (U) found?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.2178" x="2714.752" y="1755.0601">Yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="14.9585" x="2935.001" y="1755.0601">No</text><path d="M2669.5796,1783.4902 L2669.5796,1799.623 L2649.5796,1803.623 L2669.5796,1807.623 L2669.5796,1823.7559 A0,0 0 0 0 2669.5796,1823.7559 L2983.3716,1823.7559 A0,0 0 0 0 2983.3716,1823.7559 L2983.3716,1793.4902 L2973.3716,1783.4902 L2669.5796,1783.4902 A0,0 0 0 0 2669.5796,1783.4902" fill="#FFFFCC" style="stroke:#181818;stroke-width:0.5;"/><path d="M2973.3716,1783.4902 L2973.3716,1793.4902 L2983.3716,1793.4902 L2973.3716,1783.4902" fill="#FFFFCC" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="292.792" x="2675.5796" y="1800.5571">Required notation &#8212; unexcused days reduce</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="216.252" x="2675.5796" y="1815.6899">the final reimbursement amount.</text><rect fill="#E3F2FD" height="47.9375" rx="12.5" ry="12.5" style="stroke:#0D47A1;stroke-width:0.5;" width="292.9121" x="2356.6675" y="1779.6543"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="83.2148" x="2366.6675" y="1800.793">Note on form:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="272.9121" x="2366.6675" y="1814.7617">"Der/Die TN hat X unentschuldigte Fehltage."</text><rect fill="#E3F2FD" height="47.9375" rx="12.5" ry="12.5" style="stroke:#0D47A1;stroke-width:0.5;" width="324.9512" x="3003.3716" y="1779.6543"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="83.2148" x="3013.3716" y="1800.793">Note on form:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="304.9512" x="3013.3716" y="1814.7617">"Der/Die TN hat keine unentschuldigten Fehltage."</text><polygon fill="#E3F2FD" points="2834.4854,1833.5918,2846.4854,1845.5918,2834.4854,1857.5918,2822.4854,1845.5918,2834.4854,1833.5918" style="stroke:#0D47A1;stroke-width:0.5;"/><path d="M2973.999,1934.9116 L2973.999,2005.4429 L3325.3945,2005.4429 L3325.3945,1944.9116 L3315.3945,1934.9116 L2973.999,1934.9116" fill="#FFFFCC" style="stroke:#181818;stroke-width:0.5;"/><path d="M3315.3945,1934.9116 L3315.3945,1944.9116 L3325.3945,1944.9116 L3315.3945,1934.9116" fill="#FFFFCC" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="165.5405" x="2979.999" y="1951.9785">VMT Comparison Rule:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="325.2095" x="2979.999" y="1967.1113">Compare: VMT single ticket price x attended days</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="294.4551" x="2979.999" y="1982.2441">vs. full monthly Deutschlandticket (e.g. &#8364;63).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="330.3955" x="2979.999" y="1997.377">Use whichever amount is lower as the ticket basis.</text><path d="M2954.918,2025.4429 L2954.918,2111.1069 L3344.4756,2111.1069 L3344.4756,2035.4429 L3334.4756,2025.4429 L2954.918,2025.4429" fill="#FFCCCC" style="stroke:#181818;stroke-width:0.5;"/><path d="M3334.4756,2025.4429 L3334.4756,2035.4429 L3344.4756,2035.4429 L3334.4756,2025.4429" fill="#FFCCCC" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="102.9399" x="2960.918" y="2042.5098">PROBLEM 15 :</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="231.7974" x="3067.9902" y="2042.5098">This comparison is entirely manual.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="358.0776" x="2960.918" y="2057.6426">Admin must look up current VMT prices, calculate both</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="368.5576" x="2960.918" y="2072.7754">options by hand, and determine the cheaper one &#8212; with</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="274.8154" x="2960.918" y="2087.9082">no tool, template, or automation to assist.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="216.7153" x="2960.918" y="2103.041">Error-prone and time-consuming.</text><rect fill="#E3F2FD" height="33.9688" rx="12.5" ry="12.5" style="stroke:#0D47A1;stroke-width:0.5;" width="220.8652" x="2724.0527" y="2006.0249"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="200.8652" x="2734.0527" y="2027.1636">Perform VMT Vergleichsrechnung</text><polygon fill="#E3F2FD" points="2760.4932,1877.5918,2908.4775,1877.5918,2920.4775,1890.3965,2908.4775,1903.2012,2760.4932,1903.2012,2748.4932,1890.3965,2760.4932,1877.5918" style="stroke:#0D47A1;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.2178" x="2838.4854" y="1913.4116">Yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="123.0679" x="2760.4932" y="1887.8022">Attendance &lt; 10 days</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="147.9844" x="2760.4932" y="1900.6069">(under 2 weeks in month)?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="14.9585" x="2920.4775" y="1887.8022">No</text><polygon fill="#E3F2FD" points="2834.4854,2141.1069,2846.4854,2153.1069,2834.4854,2165.1069,2822.4854,2153.1069,2834.4854,2141.1069" style="stroke:#0D47A1;stroke-width:0.5;"/><path d="M2996.9658,2175.1069 L2996.9658,2251.771 L2976.9658,2255.771 L2996.9658,2259.771 L2996.9658,2336.4351 A0,0 0 0 0 2996.9658,2336.4351 L3301.8838,2336.4351 A0,0 0 0 0 3301.8838,2336.4351 L3301.8838,2185.1069 L3291.8838,2175.1069 L2996.9658,2175.1069 A0,0 0 0 0 2996.9658,2175.1069" fill="#FFFFCC" style="stroke:#181818;stroke-width:0.5;"/><path d="M3291.8838,2175.1069 L3291.8838,2185.1069 L3301.8838,2185.1069 L3291.8838,2175.1069" fill="#FFFFCC" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="140.6323" x="3002.9658" y="2192.1738">&#214;PNV Abo / Online:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="278.5225" x="3002.9658" y="2207.3066">Ticket price / Workdays x Attendance days</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="3002.9658" y="2222.4395">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="275.3804" x="3002.9658" y="2237.5723">Sozialticket (Enaam, Polina, Maryna):</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="219.2544" x="3002.9658" y="2252.7051">34 / Workdays x Attendance days</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="3002.9658" y="2267.8379">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="39.1396" x="3002.9658" y="2282.9707">PKW:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="283.918" x="3002.9658" y="2298.1035">0.20 x km (one way) x 2 x Attendance days</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="3002.9658" y="2313.2363">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="279.3159" x="3002.9658" y="2328.3691">Always write: "Erstattungsbetrag: [X] EUR"</text><rect fill="#E3F2FD" height="33.9688" rx="12.5" ry="12.5" style="stroke:#0D47A1;stroke-width:0.5;" width="284.9609" x="2692.0049" y="2238.7866"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="264.9609" x="2702.0049" y="2259.9253">Select ticket type and apply correct formula</text><rect fill="#E3F2FD" height="33.9688" rx="12.5" ry="12.5" style="stroke:#0D47A1;stroke-width:0.5;" width="252.1543" x="2708.4082" y="2356.4351"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="232.1543" x="2718.4082" y="2377.5737">Calculate final reimbursement amount</text><path d="M3020.1118,2410.4038 L3020.1118,2450.6694 L3355.0098,2450.6694 L3355.0098,2420.4038 L3345.0098,2410.4038 L3020.1118,2410.4038" fill="#FFCCCC" style="stroke:#181818;stroke-width:0.5;"/><path d="M3345.0098,2410.4038 L3345.0098,2420.4038 L3355.0098,2420.4038 L3345.0098,2410.4038" fill="#FFCCCC" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="98.4141" x="3026.1118" y="2427.4707">PROBLEM 10:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="200.2368" x="3128.6582" y="2427.4707">Currently half-digital, half-pen.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="313.8979" x="3026.1118" y="2442.6035">Admin has been asked to make this fully digital.</text><path d="M2982.9844,2470.6694 L2982.9844,2571.4663 L3392.1372,2571.4663 L3392.1372,2480.6694 L3382.1372,2470.6694 L2982.9844,2470.6694" fill="#FFCCCC" style="stroke:#181818;stroke-width:0.5;"/><path d="M3382.1372,2470.6694 L3382.1372,2480.6694 L3392.1372,2480.6694 L3382.1372,2470.6694" fill="#FFCCCC" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="93.8945" x="2988.9844" y="2487.7363">PROBLEM 3 :</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="238.9512" x="3087.0112" y="2487.7363">TNs don't know their reimbursement</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="385.3408" x="2988.9844" y="2502.8691">status, the calculated amount, or why that specific amount</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="338.8696" x="2988.9844" y="2518.002">was calculated. Admin must individually explain the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="367.4531" x="2988.9844" y="2533.1348">formula, attendance days, and deductions to each TN &#8212;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="259.0479" x="2988.9844" y="2548.2676">verbally, in person, every single month.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="388.1528" x="2988.9844" y="2563.4004">There is no self-service status page or summary document.</text><path d="M2993.7944,2591.4663 L2993.7944,2677.1304 L3381.3271,2677.1304 L3381.3271,2601.4663 L3371.3271,2591.4663 L2993.7944,2591.4663" fill="#FFCCCC" style="stroke:#181818;stroke-width:0.5;"/><path d="M3371.3271,2591.4663 L3371.3271,2601.4663 L3381.3271,2601.4663 L3371.3271,2591.4663" fill="#FFCCCC" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="93.8945" x="2999.7944" y="2608.5332">PROBLEM 2 :</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="199.894" x="3097.8213" y="2608.5332">The current process generates</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="366.5327" x="2999.7944" y="2623.666">excessive paper &#8212; forms, tickets, bank statements, and</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="303.4624" x="2999.7944" y="2638.7988">contracts are all printed and physically stored.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="349.8003" x="2999.7944" y="2653.9316">This is unsustainable and makes remote or substitute</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="183.6313" x="2999.7944" y="2669.0645">handling extremely difficult.</text><rect fill="#E3F2FD" height="33.9688" rx="12.5" ry="12.5" style="stroke:#0D47A1;stroke-width:0.5;" width="276.998" x="2695.9863" y="2526.7827"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="256.998" x="2705.9863" y="2547.9214">Write all information onto Fahrkosten form</text><rect fill="#E3F2FD" height="33.9688" rx="12.5" ry="12.5" style="stroke:#0D47A1;stroke-width:0.5;" width="200.5039" x="2734.2334" y="2707.1304"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="180.5039" x="2744.2334" y="2728.269">Hand form to TN for signature</text><rect fill="#E3F2FD" height="33.9688" rx="12.5" ry="12.5" style="stroke:#0D47A1;stroke-width:0.5;" width="202.168" x="2733.4014" y="2826.4976"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="182.168" x="2743.4014" y="2847.6362">Sign form as Sachbearbeiterin</text><rect fill="#E3F2FD" height="33.9688" rx="12.5" ry="12.5" style="stroke:#0D47A1;stroke-width:0.5;" width="297.6992" x="2685.6357" y="2880.4663"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="277.6992" x="2695.6357" y="2901.605">Attach physical Unterlagen to the signed form</text><path d="M2987.9248,2924.4351 L2987.9248,2955.7007 L2967.9248,2959.7007 L2987.9248,2963.7007 L2987.9248,2994.9663 A0,0 0 0 0 2987.9248,2994.9663 L3376.2446,2994.9663 A0,0 0 0 0 3376.2446,2994.9663 L3376.2446,2934.4351 L3366.2446,2924.4351 L2987.9248,2924.4351 A0,0 0 0 0 2987.9248,2924.4351" fill="#FFCCCC" style="stroke:#181818;stroke-width:0.5;"/><path d="M3366.2446,2924.4351 L3366.2446,2934.4351 L3376.2446,2934.4351 L3366.2446,2924.4351" fill="#FFCCCC" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="102.9399" x="2993.9248" y="2941.502">PROBLEM 16 :</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="199.2466" x="3100.9971" y="2941.502">If Kristin (Manager) is on leave</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="307.2139" x="2993.9248" y="2956.6348">or unavailable, the entire approval chain stalls.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="367.3198" x="2993.9248" y="2971.7676">There is no documented fallback &#8212; no deputy approver,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="303.291" x="2993.9248" y="2986.9004">no defined escalation path, no continuity plan.</text><rect fill="#E3F2FD" height="33.9688" rx="12.5" ry="12.5" style="stroke:#0D47A1;stroke-width:0.5;" width="266.8789" x="2701.0459" y="2942.7163"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="246.8789" x="2711.0459" y="2963.855">Hand complete paper packet to Manager</text><rect fill="#E3F2FD" height="33.9688" rx="12.5" ry="12.5" style="stroke:#0D47A1;stroke-width:0.5;" width="275.5684" x="2546.4399" y="3340.2397"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="255.5684" x="2556.4399" y="3361.3784">Fix calculations or add missing documents</text><path d="M3012.5459,3438.1772 L3012.5459,3469.4429 L2992.5459,3473.4429 L3012.5459,3477.4429 L3012.5459,3508.7085 A0,0 0 0 0 3012.5459,3508.7085 L3307.5425,3508.7085 A0,0 0 0 0 3307.5425,3508.7085 L3307.5425,3448.1772 L3297.5425,3438.1772 L3012.5459,3438.1772 A0,0 0 0 0 3012.5459,3438.1772" fill="#FFFFCC" style="stroke:#181818;stroke-width:0.5;"/><path d="M3297.5425,3438.1772 L3297.5425,3448.1772 L3307.5425,3448.1772 L3297.5425,3438.1772" fill="#FFFFCC" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="128.9717" x="3018.5459" y="3455.2441">Traceability Rule:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="245.4131" x="3018.5459" y="3470.377">Record: TN name, month, ticket type,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="273.9966" x="3018.5459" y="3485.5098">workdays, attendance days, amount paid.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="151.9312" x="3018.5459" y="3500.6426">Required for audit trail.</text><rect fill="#E3F2FD" height="33.9688" rx="12.5" ry="12.5" style="stroke:#0D47A1;stroke-width:0.5;" width="316.1211" x="2676.4248" y="3456.4585"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="296.1211" x="2686.4248" y="3477.5972">Log reimbursement data in internal Excel tracker</text><path d="M2969.8691,3524.978 L2969.8691,3548.6772 L2949.8691,3552.6772 L2969.8691,3556.6772 L2969.8691,3580.3765 A0,0 0 0 0 2969.8691,3580.3765 L3338.9175,3580.3765 A0,0 0 0 0 3338.9175,3580.3765 L3338.9175,3534.978 L3328.9175,3524.978 L2969.8691,3524.978 A0,0 0 0 0 2969.8691,3524.978" fill="#FFFFCC" style="stroke:#181818;stroke-width:0.5;"/><path d="M3328.9175,3524.978 L3328.9175,3534.978 L3338.9175,3534.978 L3328.9175,3524.978" fill="#FFFFCC" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="83.0718" x="2975.8691" y="3542.0449">Filing Rule:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="348.0483" x="2975.8691" y="3557.1777">File naming: Uebersicht_benoetigte_Nachweise_FKTN</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="345.979" x="2975.8691" y="3572.3105">Store in designated IBS Cloud folder or local T:\ path.</text><rect fill="#E3F2FD" height="47.9375" rx="12.5" ry="12.5" style="stroke:#0D47A1;stroke-width:0.5;" width="230.7676" x="2719.1016" y="3528.7085"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="210.7676" x="2729.1016" y="3549.8472">Archive all documents to IBS Cloud</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="206.9297" x="2729.1016" y="3563.8159">or T:\LAT Sprint...\Fahrtkosten_TN\</text><path d="M3026.4004,3590.3765 L3026.4004,3614.0757 L3006.4004,3618.0757 L3026.4004,3622.0757 L3026.4004,3645.7749 A0,0 0 0 0 3026.4004,3645.7749 L3387.9521,3645.7749 A0,0 0 0 0 3387.9521,3645.7749 L3387.9521,3600.3765 L3377.9521,3590.3765 L3026.4004,3590.3765 A0,0 0 0 0 3026.4004,3590.3765" fill="#FFCCCC" style="stroke:#181818;stroke-width:0.5;"/><path d="M3377.9521,3590.3765 L3377.9521,3600.3765 L3387.9521,3600.3765 L3377.9521,3590.3765" fill="#FFCCCC" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="98.4141" x="3032.4004" y="3607.4434">PROBLEM 12:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="222.9995" x="3134.9468" y="3607.4434">No clear visibility into what is Paid</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="340.5518" x="3032.4004" y="3622.5762">vs Pending. Admin constantly has to ask Accounting</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="122.7954" x="3032.4004" y="3637.709">for status updates.</text><rect fill="#E3F2FD" height="33.9688" rx="12.5" ry="12.5" style="stroke:#0D47A1;stroke-width:0.5;" width="343.8301" x="2662.5703" y="3601.0913"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="323.8301" x="2672.5703" y="3622.23">Check server Excel list to confirm payment processed</text><ellipse cx="2834.4854" cy="3676.7749" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="2834.4854" cy="3676.7749" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#000000;stroke-width:1.5;" x1="2350.6675" x2="2350.6675" y1="12.7451" y2="3687.7749"/><path d="M3686.4282,1252.5454 L3686.4282,1283.811 L3666.4282,1287.811 L3686.4282,1291.811 L3686.4282,1323.0767 A0,0 0 0 0 3686.4282,1323.0767 L4042.4067,1323.0767 A0,0 0 0 0 4042.4067,1323.0767 L4042.4067,1262.5454 L4032.4067,1252.5454 L3686.4282,1252.5454 A0,0 0 0 0 3686.4282,1252.5454" fill="#FFFFCC" style="stroke:#181818;stroke-width:0.5;"/><path d="M4032.4067,1252.5454 L4032.4067,1262.5454 L4042.4067,1262.5454 L4032.4067,1252.5454" fill="#FFFFCC" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="203.8042" x="3692.4282" y="1269.6123">Praktikum &lt;3km Exception:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="293.6807" x="3692.4282" y="1284.7451">Reimbursement below 3km is only permitted</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="250.7451" x="3692.4282" y="1299.8779">with a signed justification from Kristin.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="334.9785" x="3692.4282" y="1315.0107">Requires: internship contract + Google Maps proof.</text><rect fill="#E3F2FD" height="47.9375" rx="12.5" ry="12.5" style="stroke:#0D47A1;stroke-width:0.5;" width="253.291" x="3413.1372" y="1263.8423"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="192.7441" x="3423.1372" y="1284.981">Kristin signs written justification</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="233.291" x="3423.1372" y="1298.9497">for sub-3km Praktikum reimbursement</text><rect fill="#E3F2FD" height="33.9688" rx="12.5" ry="12.5" style="stroke:#0D47A1;stroke-width:0.5;" width="274.2148" x="3708.9365" y="3014.9663"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="254.2148" x="3718.9365" y="3036.105">Double-check documents and calculations</text><path d="M3951.0996,3058.9351 L3951.0996,3082.6343 L3931.0996,3086.6343 L3951.0996,3090.6343 L3951.0996,3114.3335 A0,0 0 0 0 3951.0996,3114.3335 L4316.4282,3114.3335 A0,0 0 0 0 4316.4282,3114.3335 L4316.4282,3068.9351 L4306.4282,3058.9351 L3951.0996,3058.9351 A0,0 0 0 0 3951.0996,3058.9351" fill="#FFCCCC" style="stroke:#181818;stroke-width:0.5;"/><path d="M4306.4282,3058.9351 L4306.4282,3068.9351 L4316.4282,3068.9351 L4306.4282,3058.9351" fill="#FFCCCC" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="98.4141" x="3957.0996" y="3076.002">PROBLEM 11:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="241.7822" x="4059.646" y="3076.002">Scanning all physical documents and</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="278.7256" x="3957.0996" y="3091.1348">sending them to the secretaries is a highly</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="163.687" x="3957.0996" y="3106.2676">time-consuming process.</text><rect fill="#E3F2FD" height="33.9688" rx="12.5" ry="12.5" style="stroke:#0D47A1;stroke-width:0.5;" width="170.1113" x="3760.9883" y="3069.6499"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="150.1113" x="3770.9883" y="3090.7886">Scan the physical packet</text><rect fill="#E3F2FD" height="33.9688" rx="12.5" ry="12.5" style="stroke:#0D47A1;stroke-width:0.5;" width="229.9004" x="3731.0938" y="3134.3335"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="209.9004" x="3741.0938" y="3155.4722">Send scanned version to Secretary</text><line style="stroke:#000000;stroke-width:1.5;" x1="3407.1372" x2="3407.1372" y1="12.7451" y2="3687.7749"/><rect fill="#E3F2FD" height="33.9688" rx="12.5" ry="12.5" style="stroke:#0D47A1;stroke-width:0.5;" width="318.2012" x="4327.4282" y="3188.3022"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="298.2012" x="4337.4282" y="3209.4409">Forward scanned documents to Accounting Team</text><line style="stroke:#000000;stroke-width:1.5;" x1="4321.4282" x2="4321.4282" y1="12.7451" y2="3687.7749"/><rect fill="#E3F2FD" height="33.9688" rx="12.5" ry="12.5" style="stroke:#0D47A1;stroke-width:0.5;" width="276.1719" x="4655.6294" y="3242.271"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="256.1719" x="4665.6294" y="3263.4097">Verify manual calculations and documents</text><polygon fill="#E3F2FD" points="4756.7944,3296.2397,4830.6362,3296.2397,4842.6362,3308.2397,4830.6362,3320.2397,4756.7944,3320.2397,4744.7944,3308.2397,4756.7944,3296.2397" style="stroke:#0D47A1;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="73.8418" x="4756.7944" y="3312.0479">Errors found?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.2178" x="4725.5767" y="3305.6455">Yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="14.9585" x="4842.6362" y="3305.6455">No</text><rect fill="#E3F2FD" height="33.9688" rx="12.5" ry="12.5" style="stroke:#0D47A1;stroke-width:0.5;" width="222.6172" x="4832.668" y="3340.2397"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="202.6172" x="4842.668" y="3361.3784">Process Reimbursement Payment</text><rect fill="#E3F2FD" height="33.9688" rx="12.5" ry="12.5" style="stroke:#0D47A1;stroke-width:0.5;" width="285.4766" x="4801.2383" y="3394.2085"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="265.4766" x="4811.2383" y="3415.3472">Upload latest Payment List (Excel) to Server</text><line style="stroke:#000000;stroke-width:1.5;" x1="4649.6294" x2="4649.6294" y1="12.7451" y2="3687.7749"/><line style="stroke:#000000;stroke-width:1.5;" x1="5090.7148" x2="5090.7148" y1="12.7451" y2="3687.7749"/><polygon fill="#181818" points="3402.0449,1523.7051,3406.0449,1513.7051,3410.0449,1523.7051" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="188.7578" x2="188.7578" y1="58.6982" y2="172.3779"/><polygon fill="#181818" points="184.7578,162.3779,192.7578,162.3779,188.7578,172.3779" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="961.9888" x2="961.9888" y1="363.9951" y2="383.9951"/><polygon f